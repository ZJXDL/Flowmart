version: 2

models:
  - name: orders_current
    description: "Deduplicated current state of e-commerce orders."

    columns:
      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Identifier of the customer who placed the order."
        tests:
          - not_null

      - name: status
        description: "Current status of the order."
        tests:
          - not_null

      - name: total_amount
        description: "Total monetary value of the order."
        tests:
          - not_null

  - name: orders
    description: "Analytical order model built from the deduplicated current order state."

    columns:
      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Identifier of the customer who placed the order."
        tests:
          - not_null

      - name: status
        description: "Current status of the order."
        tests:
          - not_null

      - name: total_amount
        description: "Total monetary value of the order."
        tests:
          - not_null

  - name: daily_sales
    description: "Daily sales metrics derived from the analytical order model."

    columns:
      - name: sales_date
        description: "Calendar date on which the orders were created."
        tests:
          - not_null
          - unique

      - name: order_count
        description: "Number of orders created on the sales date."
        tests:
          - not_null

      - name: total_revenue
        description: "Total revenue generated by orders on the sales date."
        tests:
          - not_null

      - name: average_order_value
        description: "Average monetary value of orders on the sales date."
        tests:
          - not_null