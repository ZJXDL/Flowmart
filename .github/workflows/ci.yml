name: Flowmart CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Flowmart Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-analyst/requirements.txt
          pip install psycopg[binary]

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.example config --quiet

      - name: Compile Python modules
        run: |
          python -m compileall -q apps semantic pipelines quality observability

      - name: Build Flink runtime image
        run: |
          docker build -f infrastructure/flink/Dockerfile -t flowmart-flink:ci .

      - name: Validate semantic layer
        run: |
          python semantic/validator.py

      - name: Test semantic query builder
        run: |
          python apps/ai-analyst/src/semantic_query_builder.py

      - name: Test analyst intent
        run: |
          python apps/ai-analyst/src/analyst_intent.py

      - name: Test LLM intent interpreter
        run: |
          python apps/ai-analyst/src/llm_intent_interpreter.py

      - name: Test Trino query security
        run: |
          python apps/ai-analyst/src/tools/trino_tool.py

      - name: Test answer generator
        run: |
          python apps/ai-analyst/src/analyst_answer_generator.py

      - name: Test LLM analyst engine
        run: |
          python apps/ai-analyst/src/llm_analyst_engine.py

      - name: Test statistical anomaly detector
        run: |
          python quality/anomaly/detectors/statistical_detector.py

      - name: Test anomaly detection service
        run: |
          python quality/anomaly/anomaly_service.py

      - name: Test anomaly alert builder
        run: |
          python quality/anomaly/alerts/anomaly_alert.py

      - name: Test anomaly runner
        run: |
          python quality/anomaly/anomaly_runner.py

      - name: Test pipeline metrics
        run: |
          python observability/metrics/pipeline_metrics.py

      - name: Test observability alerts
        run: |
          python observability/alerts/observability_alerts.py

      - name: Test health dashboard
        run: |
          python observability/dashboards/health_dashboard.py

      - name: CI completed
        run: |
          echo "Flowmart CI completed successfully."

  publish-flink-image:
    name: Publish Flink Runtime Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zjxdl/flowmart-flink
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and publish the Flink runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/flink/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

