services:
  postgres:
    image: postgres:17
    container_name: atlas-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - atlas-network

  minio:
    image: minio/minio:latest
    container_name: atlas-minio
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - atlas-network

  kafka:
    image: apache/kafka:4.1.0
    container_name: atlas-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - atlas-network

  kafka-connect:
    image: quay.io/debezium/connect:3.3
    container_name: atlas-kafka-connect
    restart: unless-stopped
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: atlas-connect-cluster

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      REST_HOST_NAME: 172.23.0.2
      REST_PORT: 8083
      REST_ADVERTISED_HOST_NAME: 172.23.0.2
      REST_ADVERTISED_PORT: 8083

      OFFSET_FLUSH_INTERVAL_MS: 60000
      OFFSET_FLUSH_TIMEOUT_MS: 5000
      TASK_SHUTDOWN_GRACEFUL_TIMEOUT_MS: 10000

      CONNECT_PLUGIN_PATH: /kafka/connect

      KAFKA_HEAP_OPTS: "-Xms128M -Xmx768M"
    networks:
      - atlas-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: atlas-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: atlas
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - atlas-network

  flink-jobmanager:
    image: flink:2.1.0-scala_2.12-java17
    container_name: atlas-flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    volumes:
      - ./infrastructure/flink/lib/flink-connector-kafka-5.0.0-2.1.jar:/opt/flink/lib/flink-connector-kafka-5.0.0-2.1.jar:ro
      - ./infrastructure/flink/lib/flink-sql-connector-kafka-5.0.0-2.1.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.1.jar:ro
      - ./infrastructure/flink/lib/kafka-clients-4.2.0.jar:/opt/flink/lib/kafka-clients-4.2.0.jar:ro
      - ./pipelines/bronze/atlas-bronze-udf.jar:/opt/flink/lib/atlas-bronze-udf.jar:ro
    networks:
      - atlas-network

  flink-taskmanager:
    image: flink:2.1.0-scala_2.12-java17
    container_name: atlas-flink-taskmanager
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 1
    volumes:
      - ./infrastructure/flink/lib/flink-connector-kafka-5.0.0-2.1.jar:/opt/flink/lib/flink-connector-kafka-5.0.0-2.1.jar:ro
      - ./infrastructure/flink/lib/flink-sql-connector-kafka-5.0.0-2.1.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.1.jar:ro
      - ./infrastructure/flink/lib/kafka-clients-4.2.0.jar:/opt/flink/lib/kafka-clients-4.2.0.jar:ro
      - ./pipelines/bronze/atlas-bronze-udf.jar:/opt/flink/lib/atlas-bronze-udf.jar:ro
    networks:
      - atlas-network

networks:
  atlas-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  kafka_data: